server:
  port: 8080

spring:
  application:
    name: by-railway
  datasource:
    url: jdbc:postgresql://localhost:5432/railway
    username: railway_admin
    password: 111
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration