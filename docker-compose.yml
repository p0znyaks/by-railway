services:
  postgres:
    image: postgres:17
    container_name: railway-postgres
    environment:
      - POSTGRES_DB=railway
      - POSTGRES_USER=railway_admin
      - POSTGRES_PASSWORD=111
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: railway-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: